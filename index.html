<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ejner Hessel – Lastbil Rapport Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #n8n-chat {
      height: 100%;
    }

    /* SUPER TOP LAYER BUTTON */
    #fake-wip {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2147483647; /* max-ish */
      padding: 10px 12px;
      background: #0b5ed7;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    #fake-wip:active {
      transform: translateY(1px);
    }
  </style>
</head>

<body>
  <button id="fake-wip">🧪 Fake WIP</button>
  <div id="n8n-chat"></div>

  <script type="module">
    import { createChat } from "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js";

    createChat({
      webhookUrl: "https://jakework.app.n8n.cloud/webhook/68304164-b0b8-4424-82f4-cdd95c1794ce/chat",
      mode: "fullscreen",

      allowFileUploads: true,
      allowedFilesMimeTypes: "audio/*",

      loadPreviousSession: true,
      showWelcomeScreen: true,

      initialMessages: [
        "Hej!",
        "Hej, jeg hjælper dig videre med din mekaniker rapport – bare skriv hvad du har gjort, så laver vi den sammen!"
      ],

      i18n: {
        en: {
          title: "Ejner Hessel – Lastbil Rapport Agent",
          subtitle: "",
          inputPlaceholder: "Skriv hvad du har gjort…",
          getStarted: "Ny samtale"
        }
      }
    });

    // Fallback: send besked ved at fylde chat input + trykke send
    function injectAndSend(message) {
      // Find textarea inde i chatten
      const textarea = document.querySelector("textarea");
      if (!textarea) {
        alert("Kunne ikke finde chat-input endnu. Prøv igen om 1-2 sek.");
        return;
      }

      textarea.focus();
      textarea.value = message;
      textarea.dispatchEvent(new Event("input", { bubbles: true }));

      // Find send-knappen (kan variere lidt, så vi prøver nogle muligheder)
      const sendBtn =
        document.querySelector('button[type="submit"]') ||
        Array.from(document.querySelectorAll("button")).find(b => /send|sende|submit/i.test(b.textContent || ""));

      if (sendBtn) sendBtn.click();
      else alert("Kunne ikke finde send-knappen. Skriv enter manuelt.");
    }

    document.getElementById("fake-wip").addEventListener("click", () => {
      const fakeMessage = `
[WIP_CONTEXT]
WIP: 999999
Kundeklager:
- Motorlampe lyser
- Manglende trækkraft
- AdBlue fejlmeddelelse
[/WIP_CONTEXT]
      `.trim();

      injectAndSend(fakeMessage);
    });
  </script>
</body>
</html>
